# Oracle -> Adabas log-based sync lab.
# Everything runs on the internal network; no internet needed after image pulls.
#
# DUPLICATED in the sibling repo (adabas-to-oracle-migration) with a different
# project name, container prefix and service set. If you change something
# structural here, check whether the other one needs it too.
#
# PORTS: 60001, 8190, 2700, 1521 and 8081 are published. The sibling repo
# publishes all of those except 8081. Stop one lab before starting the other.

name: o2a

services:

  adabas:
    image: softwareag/adabas-ce:7.4.0
    container_name: o2a-adabas
    hostname: o2a-adabas   # fixed: nucleus writes a host-bound lock (/data/db001/_DB_LOCK);
                           # a recreated container with a random hostname trips ADANUC-F-CONCURRLOCKHOST
    environment:
      ACCEPT_EULA: "Y"
      ADABAS_ADMIN_USER: admin      # REST service credentials (spike finding)
      ADABAS_ADMIN_PWD: manage
      # Demo DB: DBID 001, created by crdemodb on first start (default ADABAS_DB_CREATION=demodb)
    ports:
      - "60001:60001"   # Adabas TCP
      - "8190:8190"     # Adabas REST server (built into adabas-ce)
    volumes:
      - adabas-data:/data
    networks: [o2a]

  natural:
    image: softwareag/natural-ce:9.3.3
    container_name: o2a-natural
    environment:
      ACCEPT_EULA: "Y"
    depends_on: [adabas]
    ports:
      - "2700:2700"     # Natural development server for NaturalONE
    volumes:
      - ./natural:/poc/natural:ro   # apply program sources (host-edited)
      - ./sync:/sync                # inbox/applied/rejected + work staging
      - ./data:/poc/data            # scratch space: the spike programs write
                                    # their result files here (run-spike-*.sh)
    networks: [o2a]

  oracle:
    image: gvenzl/oracle-free:23-slim
    container_name: o2a-oracle
    environment:
      ORACLE_PASSWORD: PocSysPwd1
      APP_USER: pocapp
      APP_USER_PASSWORD: pocapp
    ports:
      - "1521:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata
      - ./oracle-init:/container-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 120s
    networks: [o2a]

  # Long-lived Hop JVM for the sync's reverse field mapping.
  # Started only with the `sync` profile.
  #
  # WHY A SERVER AND NOT `hop-run` PER BATCH: a cold `hop-run` costs ~23 s of JVM
  # startup against ~0.4 s warm - a 54x gap measured during the spikes. The sync
  # latency budget is 5-10 s END TO END, so spawning a JVM per batch would be
  # dominated by startup: the mapping step alone would cost several times the
  # entire budget. The server keeps one warm JVM and takes work over REST.
  #
  # Server mode is selected by the ABSENCE of HOP_FILE_PATH and HOP_COMMAND
  # (see /opt/hop/load-and-execute.sh) - there is no explicit "mode" switch.
  hop-server:
    image: apache/hop:latest
    container_name: o2a-hop-server
    profiles: ["sync"]
    depends_on:
      oracle:
        condition: service_healthy
    environment:
      HOP_PROJECT_FOLDER: /poc/hop
      HOP_PROJECT_NAME: o2a
      HOP_SERVER_PORT: 8081
      HOP_SERVER_SHUTDOWNPORT: 8082
      HOP_SERVER_HOSTNAME: 0.0.0.0
      HOP_SERVER_USER: cluster
      HOP_SERVER_PASS: cluster
      HOP_LOG_LEVEL: Basic
      ORACLE_HOST: oracle
    ports:
      - "8081:8081"
    volumes:
      - ./hop:/poc/hop
      - ./sync:/sync
      # ojdbc11.jar is NOT in this repo (Oracle OTN licence) - see README
      # "Prerequisites". sync-verify.cmd checks it exists before starting the
      # lab, because Docker would otherwise create a DIRECTORY with this name.
      - ./hop/lib/ojdbc11.jar:/opt/hop/lib/jdbc/ojdbc11.jar:ro
    healthcheck:
      # getStatus is the cheapest authenticated endpoint that proves the
      # REST layer is up, not merely the port being bound.
      test: ["CMD-SHELL", "curl -sf -u cluster:cluster http://localhost:8081/hop/status/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
    networks: [o2a]

  # ---------------------------------------------------------------------------
  # Observability (profile: observability) - see observability/README.md
  #
  # AN OBSERVER, NEVER A DEPENDENCY. The sync must run correctly with every
  # service below stopped, so none of them is in the `sync` profile and nothing
  # in the sync path depends on them. The only coupling in the other direction
  # is the read-only /sync mount.
  # ---------------------------------------------------------------------------

  # Turns the sync/ directory tree into Prometheus metrics, and receives
  # Alertmanager's webhook. Pulled, never built: python:3-alpine gives busybox
  # for the directory walk and a stdlib HTTP server for the two endpoints.
  # (Plain alpine cannot: it no longer ships the busybox httpd applet, and
  # installing it would need the network on every container start.)
  sync-exporter:
    image: python:3.13-alpine
    container_name: o2a-sync-exporter
    profiles: ["observability"]
    command: ["sh", "/opt/sync-exporter/entrypoint.sh"]
    environment:
      SYNC_DIR: /sync
      BUILD_INTERVAL: "5"   # a term in the stall-alert budget, and a cheap one
      HTTP_PORT: "9101"
    volumes:
      - ./observability/exporter:/opt/sync-exporter:ro
      # READ-ONLY, deliberately. A process that cannot rename a batch directory
      # can never damage the queue it is watching - and it sidesteps the Windows
      # bind-mount rename restriction that shaped the rest of this design.
      - ./sync:/sync:ro
      # The one thing it writes, and nothing in the sync path reads it.
      - ./sync/alerts:/alerts
    ports:
      - "9101:9101"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9101/sync.prom || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks: [o2a]

  prometheus:
    image: prom/prometheus:v3.2.1
    container_name: o2a-prometheus
    profiles: ["observability"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # A lab that is left running for weeks should not quietly grow without
      # limit - the archive logs already do enough of that.
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
    volumes:
      - ./observability/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks: [o2a]

  alertmanager:
    image: prom/alertmanager:v0.28.1
    container_name: o2a-alertmanager
    profiles: ["observability"]
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./observability/alertmanager:/etc/alertmanager:ro
      - alertmanager-data:/alertmanager
    ports:
      - "9093:9093"
    networks: [o2a]

  grafana:
    image: grafana/grafana:11.6.0
    container_name: o2a-grafana
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      # Anonymous viewing so the dashboard is one click from the README with no
      # login step. Editing still requires the admin account.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_DEFAULT_THEME: dark
      # OFFLINE. Every one of these reaches the internet by default, and this lab
      # is air-gapped by requirement - the whole project exists because the real
      # deployment has no internet either. Turn them off explicitly rather than
      # relying on the network being absent.
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on: [prometheus]
    networks: [o2a]

volumes:
  adabas-data:
  oracle-data:
  prometheus-data:
  alertmanager-data:
  grafana-data:

networks:
  o2a:
