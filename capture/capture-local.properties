# Oracle to Adabas sync - Oracle capture configuration (spec C2).
#
# Every key here can be overridden by an environment variable of the same
# name in upper snake case, e.g. DATABASE_HOSTNAME. That is how the same
# file works both from the host (localhost) and from inside the compose
# network (oracle) - the ORACLE_HOST lesson from the migration lab.

capture.name        = o2a-oracle-capture
topic.prefix        = o2a

database.hostname   = localhost
database.port       = 1521
database.user       = c##dbzuser
database.password   = dbz

# Mining runs against the CDB ROOT; the tables live in the PDB.
# Spike S2 confirmed SRC_CON_NAME=FREEPDB1 while mining from the root.
database.dbname     = FREE
database.pdb.name   = FREEPDB1

# THE SCOPE LEVER. In production this holds only the tables confirmed to be
# written on BOTH sides (open decision O5 - it decides whether this is
# three aggregates or three hundred).
table.include.list  = POCAPP.TRAFFIC_FINE,POCAPP.TRAFFIC_FINE_OFFENCE,POCAPP.TRAFFIC_FINE_PAYMENT

# the migration lab already did the bulk load - a snapshot would re-emit every
# existing row as a change.
snapshot.mode       = no_data

# no_data still takes a SCHEMA snapshot, and that path LOCKs every included
# table (ORA-41900 without the privilege). Locking only matters when data is
# being snapshotted, and we snapshot none - so switch it off rather than
# granting the capture user LOCK ANY TABLE.
snapshot.locking.mode = none

offset.storage.file.filename            = ./sync/state/offsets.dat
offset.flush.interval.ms                = 5000
schema.history.internal.file.filename   = ./sync/state/schema-history.dat

# --- assembler settings (spec C3/C4) -------------------------------------
# Loop prevention: capture DROPS every change made by this user, so
# replicated writes never travel back (decision D6). Compare-before-write
# in the Natural applier is the second line of defence (D7).
originator.filter.user  = SYNCAPP

# Batch flush interval in milliseconds. Dominant term in the latency
# budget (spec 5.5 targets ~5-10 s end to end).
batch.flush.interval.ms = 5000
batch.outbox.dir        = ./sync/outbox
